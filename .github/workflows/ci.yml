name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # The npm package.json's packageManager names, not the one Node bundles: Renovate writes
      # the lockfile with that npm, so CI installs it with the same one.
      - name: Setup npm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Run checks (astro + eslint + prettier)
        run: npm run check

      # Fails on a build warning not in scripts/build-warnings-allowed.txt.
      - name: Build (gate deploy-time regressions on PRs)
        run: npm run build:strict
