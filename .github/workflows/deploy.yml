name: Deploy Docs

on:
  push:
    branches: [main]
  # Sent by jellyrock/jellyrock's notify-docs.yml when a file fetch-docs.mjs reads changes on main
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

concurrency:
  group: deploy-docs
  # Never stop a deploy halfway through rsync. A newer push waits, then deploys.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The checks, build and functional browser tests a pull request runs (ci.yml). Upstream
  # docs-update rebuilds never get a PR here, so this is their only gate. Build warnings are
  # listed, not failing, and screenshots aren't compared: both depend on upstream content.
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      deploy: true

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      # Deploy exactly the builds the gates tested, not a fresh rebuild.
      - name: Download tested builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy user docs to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            user-docs/dist/ \
            "${VPS_USER}@${VPS_HOST}:/opt/jellyrock/user-docs/"

      - name: Deploy dev docs to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dev-docs/dist/ \
            "${VPS_USER}@${VPS_HOST}:/opt/jellyrock/dev-docs/"

  # Deploy heartbeat (ADR-0005). Its own job so a failure in the gates alerts too, not only a
  # failed rsync. Values passed via env, never inlined into the script, to avoid commit-message
  # shell injection. No-op until the GOTIFY_URL secret is set.
  notify:
    needs: [gates, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Gotify
        env:
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          REPO: ${{ github.event.repository.name }}
          GATES: ${{ needs.gates.result }}
          DEPLOY: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'upstream docs-update or manual run' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$GOTIFY_URL" ] && { echo "GOTIFY_URL unset — skipping"; exit 0; }
          if [ "$GATES" = success ] && [ "$DEPLOY" = success ]; then
            title="${REPO} deploy ok"; priority=3; detail="Deployed."
          elif [ "$GATES" = cancelled ] || [ "$DEPLOY" = cancelled ]; then
            title="${REPO} deploy cancelled"; priority=5; detail="Run was cancelled."
          elif [ "$GATES" != success ]; then
            title="${REPO} deploy FAILED"; priority=8; detail="Checks, build or browser tests failed; nothing was deployed."
          else
            title="${REPO} deploy FAILED"; priority=8; detail="Tests passed but rsync failed."
          fi
          curl -fsS -m 10 "$GOTIFY_URL" \
            -F "priority=${priority}" \
            -F "title=${title}" \
            -F "message=${detail}
          Commit: ${COMMIT_MSG}
          Run: ${RUN_URL}" || true
